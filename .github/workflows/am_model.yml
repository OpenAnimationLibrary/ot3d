name: A:M model foundation
on:
  push:
    paths: ['toonz/sources/am/**', '.github/workflows/am_model.yml']
  pull_request:
    paths: ['toonz/sources/am/**', '.github/workflows/am_model.yml']
permissions:
  contents: read
concurrency:
  group: am-model-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S toonz/sources/am -B build-am -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-am --config Debug --parallel 2
      - run: ctest --test-dir build-am -C Debug --output-on-failure
  sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: >-
          cmake -S toonz/sources/am -B build-am-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-am-san --parallel 2
      - run: ctest --test-dir build-am-san --output-on-failure
