name: A:M FX acceptance preparation
on:
  push:
    branches: [maintenance/am-fx-acceptance]
    paths: [.github/workflows/am_fx_acceptance.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 13c7c54f18bbceabb272a5bb108e2170f60e932d
          persist-credentials: false
      - name: Reproduce the exact tested source and export blob references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v clang-format-14 || { sudo apt-get update -qq; sudo apt-get install -y clang-format-14; }
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,re,subprocess,urllib.request
          from pathlib import Path
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/OpenAnimationLibrary/ot3d/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r:return base64.b64decode(json.load(r)['content'])
          patch=gzip.decompress(blob('4045443b329c4245dcc3ba369e765ce3f5e459da'))
          assert hashlib.sha256(patch).hexdigest()=='ed7fce334302a4816bac9d2ff1d54681fb1b06410f4273d4b1319e8118469222'
          subprocess.run(['git','apply','--ignore-space-change','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--ignore-space-change','-'],input=patch,check=True)
          for sha in ['1b5f7e28ba1ba21446a36a9a37424b25165e1ad1','d1a0bbbe8e6eb74e81229ec144775831e5f7155b','d088ce85564e941e6b6ae7d89c7727045fec0d7d']:
              subprocess.run(['python3','-'],input=blob(sha),check=True)
          p=Path('toonz/sources/am/tests/amlevel_test.cpp');s=p.read_text()
          assert s.count('#include "trenderer.h"')==1
          assert s.count('  TRenderer::initialize();')==1
          s=s.replace('#include "trenderer.h"','#include "trenderer.h"\n#include "tthread.h"')
          s=s.replace('  TRenderer::initialize();','  TThread::init();\n  TRenderer::initialize();')
          p.write_text(s)
          staging=['git','add','toonz/sources','.github/workflows/workflow_linux.yml','doc/ot3d/AM_MODEL_LEVEL.md']
          subprocess.run(staging,check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for path in changed:
              if not path.endswith(('.cpp','.h')):continue
              diff=subprocess.check_output(['git','diff','--cached','--unified=0','--',path],text=True)
              ranges=[]
              for start,count in re.findall(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@',diff,re.M):
                  count=int(count or 1)
                  if count:ranges.append(f'--lines={start}:{int(start)+count-1}')
              if ranges:subprocess.run(['clang-format-14','-i','-style=file',*ranges,path],check=True)
          subprocess.run(staging,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          extra={'.github/workflows/workflow_linux.yml','doc/ot3d/AM_MODEL_LEVEL.md'}
          assert all(p in extra or (p.startswith('toonz/sources/') and p.endswith(('.cpp','.h','CMakeLists.txt'))) for p in changed),changed
          for p in changed:
              sha=subprocess.check_output(['git','hash-object',p],text=True).strip()
              # All blobs were uploaded before the tree request in successful native-test run 41836690023.
              assert blob(sha)==Path(p).read_bytes(), ('tested blob mismatch',p,sha)
              print('VERIFIED_ENTRY',json.dumps({'path':p,'type':'blob','mode':'100644','sha':sha}),flush=True)
          print('BASE_TREE',subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip())
          print('No repository object or branch was changed by this read-only preparation.')
          PY
