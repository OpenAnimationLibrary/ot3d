name: A:M FX acceptance preparation
on:
  push:
    branches: [maintenance/am-fx-acceptance]
    paths: [.github/workflows/am_fx_acceptance.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2e79628421c8ab70efbc44f3da1db39124cc302f
          fetch-depth: 0
          persist-credentials: false
      - name: Match PR-wide formatting and prepare whitespace-only commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v clang-format-14 || { sudo apt-get update -qq; sudo apt-get install -y clang-format-14; }
          python3 - <<'PY'
          import json,os,re,subprocess,urllib.request
          from pathlib import Path
          parent='2e79628421c8ab70efbc44f3da1db39124cc302f'
          base='44d8b09c2d828a8880be13d2a7a3d3977b18748f'
          files=[p for p in subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines() if p.startswith('toonz/sources/') and p.endswith(('.cpp','.h'))]
          originals={p:Path(p).read_bytes() for p in files}
          def arguments(p):
              diff=subprocess.check_output(['git','diff','--unified=0',base,'--',p],text=True)
              ranges=[]
              for start,count in re.findall(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@',diff,re.M):
                  count=int(count or 1)
                  if count:ranges.append(f'--lines={start}:{int(start)+count-1}')
              return ['clang-format-14','-style=file',*ranges,p]
          for iteration in range(3):
              before={p:Path(p).read_bytes() for p in files}
              for p in files:subprocess.run(arguments(p)+['-i'],check=True)
              if all(before[p]==Path(p).read_bytes() for p in files):break
          for p in files:
              assert re.sub(rb'\s+',b'',originals[p])==re.sub(rb'\s+',b'',Path(p).read_bytes()), ('not whitespace-only',p)
              subprocess.run(arguments(p)+['--dry-run','--Werror'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed and all(p in files for p in changed),changed
          url='https://api.github.com/repos/OpenAnimationLibrary/ot3d'
          def api(path,data=None):
              req=urllib.request.Request(url+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          assert api('/git/ref/heads/feature/am-model-level-3d-transforms')['object']['sha']==parent,'PR head changed'
          entries=[]
          for p in changed:
              b=api('/git/blobs',{'content':Path(p).read_text(),'encoding':'utf-8'})
              entries.append({'path':p,'mode':'100644','type':'blob','sha':b['sha']})
          tree=api('/git/trees',{'base_tree':api('/git/commits/'+parent)['tree']['sha'],'tree':entries})
          commit=api('/git/commits',{'message':'Match PR-wide clang-format ranges for A:M render integration','tree':tree['sha'],'parents':[parent]})
          print('PREPARED_COMMIT',commit['sha'])
          print('PREPARED_TREE',tree['sha'])
          print('FILES',changed)
          print('Verified whitespace-only; no branch reference updated.')
          PY
