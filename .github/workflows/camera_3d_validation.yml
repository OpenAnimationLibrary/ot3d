name: Spatial camera development
on:
  push:
    branches: [maintenance/camera-3d-validation]
    paths: [.github/workflows/camera_3d_validation.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 90a36968a101e238d974c4d949a0fad5eb154f82
          persist-credentials: false
      - name: Assemble reviewed source without modifying a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v clang-format-14 || { sudo apt-get update -qq; sudo apt-get install -y clang-format-14; }
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,re,subprocess,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/OpenAnimationLibrary/ot3d'
          def api(path,data=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          def blob(sha):return base64.b64decode(api('/git/blobs/'+sha)['content']).decode()
          chunks=[blob(s) for s in ['d4a7647bc49cdcc3db3ee2495f3ea56394ee6d29','5585e868f4e15281f3f945fa551bce40f7ee6d27','844984d8b401415070e207df896ddfdf3b94434f']]
          chunks[2]=chunks[2].replace('Ewjzc3q3UHQ','Ewjzc3qUHQ').replace('ibbxzJMjTk','ibbxzMjTk')
          patch=gzip.decompress(base64.b64decode(''.join(chunks)))
          assert hashlib.sha256(patch).hexdigest()=='57a73e24dc5b64e0a7efeeaeb35fa672f23bb3779809364a7f898881493e51a0'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for sha in ['29494fee1cd5cb54e6c88f0a2a612f1e39df0341','a24ced13b2df84634f1f30e4a9a2ec54cfdf7416']:
              subprocess.run(['python3','-'],input=blob(sha).encode(),check=True)
          paths=['toonz/sources','stuff/profiles/layouts/fxs/STD_transform3DFx.xml','doc/ot3d/SPATIAL_CAMERA.md','doc/transform3d_fx.md','.github/workflows/workflow_linux.yml']
          subprocess.run(['git','add',*paths],check=True)
          files=[p for p in subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines() if p.endswith(('.cpp','.h'))]
          def args(p):
              diff=subprocess.check_output(['git','diff','--unified=0','HEAD','--',p],text=True)
              ranges=[]
              for start,count in re.findall(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@',diff,re.M):
                  count=int(count or 1)
                  if count:ranges.append(f'--lines={start}:{int(start)+count-1}')
              return ['clang-format-14','-style=file',*ranges,p]
          for iteration in range(4):
              before={p:Path(p).read_bytes() for p in files}
              for p in files:subprocess.run(args(p)+['-i'],check=True)
              if all(before[p]==Path(p).read_bytes() for p in files):break
          for p in files:subprocess.run(args(p)+['--dry-run','--Werror'],check=True)
          subprocess.run(['git','add',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          extra=set(paths[1:])
          assert len(changed)==24
          assert all(p in extra or (p.startswith('toonz/sources/') and p.endswith(('.h','.cpp','CMakeLists.txt'))) for p in changed),changed
          entries=[]
          for p in changed:
              b=api('/git/blobs',{'content':Path(p).read_text(),'encoding':'utf-8'})
              entry={'path':p,'mode':'100644','type':'blob','sha':b['sha']}
              entries.append(entry)
              print('PREPARED_ENTRY',json.dumps(entry),flush=True)
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          Path('/tmp/camera-manifest.json').write_text(json.dumps({'base_tree':tree,'entries':entries},indent=2))
          print('BASE_TREE',tree)
          print('Source assembly and format only; native validation is run 41863337016. No branch reference changed.')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: spatial-camera-source-manifest
          path: /tmp/camera-manifest.json
          retention-days: 3
