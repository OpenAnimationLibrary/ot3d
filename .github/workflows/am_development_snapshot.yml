name: A:M development source snapshot
on:
  push:
    branches: [feature/am-model-level-3d-transforms]
    paths: [.github/workflows/am_development_snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/ot3d-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: am-level-development-source
          path: ${{ runner.temp }}/ot3d-source.zip
          retention-days: 1
