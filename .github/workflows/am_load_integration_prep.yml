name: Prepare A:M loading integration
on:
  push:
    branches: [maintenance/am-load-integration-prep]
    paths: [.github/workflows/am_load_integration_prep.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Prepare Unicode Apply-button correction without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          parent='9760364c2be1eec82da1be5dc96691789a1db834'
          base='https://api.github.com/repos/OpenAnimationLibrary/ot3d'
          def api(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          assert api('/git/ref/heads/feature/am-model-level-3d-transforms')['object']['sha']==parent, 'PR head changed'
          path='toonz/sources/toonz/filebrowserpopup.cpp'
          source=api('/contents/'+path+'?ref='+parent)
          content=base64.b64decode(source['content']).decode('utf-8')
          start=content.index('void FileBrowserPopup::onApplyPressed()')
          end=content.index('void FileBrowserPopup::onFilePathClicked',start)
          before=content[start:end]
          old='TFilePath(m_nameField->text().toStdString()));'
          new='TFilePath(m_nameField->text().toStdWString()));'
          assert before.count(old)==1, 'Apply filename conversion changed'
          after=before.replace(old,new)
          content=content[:start]+after+content[end:]
          blob=api('/git/blobs',{'content':content,'encoding':'utf-8'})
          tree=api('/git/trees',{'base_tree':api('/git/commits/'+parent)['tree']['sha'],'tree':[{'path':path,'mode':'100644','type':'blob','sha':blob['sha']}]})
          commit=api('/git/commits',{'message':'Preserve Unicode filenames when applying a model load\n\nUse the same wide filename conversion for Apply as for Load/OK.','tree':tree['sha'],'parents':[parent]})
          print('PREPARED_COMMIT',commit['sha'])
          print('PREPARED_TREE',tree['sha'])
          print('Only the Apply filename conversion changes; no branch reference updated.')
          PY
