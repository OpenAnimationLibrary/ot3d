name: Publish OT3D 0.1.0-alpha.2

on:
  push:
    branches: [release/0.1.0-alpha.2]
    paths: [.github/workflows/release_alpha.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: ot3d-v0.1.0-alpha.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 4f957f26bd62d39a1de21a69505b318f578dfabf
      WINDOWS_RUN: 42235301710
      RELEASE_TAG: ot3d-v0.1.0-alpha.2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4f957f26bd62d39a1de21a69505b318f578dfabf
          persist-credentials: false
      - name: Verify and package the Windows build
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time
          import zipfile

          repo = os.environ['GH_REPO']
          sha = os.environ['SOURCE_SHA']
          run_id = int(os.environ['WINDOWS_RUN'])
          tag = os.environ['RELEASE_TAG']
          package_name = 'OT3D-0.1.0-alpha.2-windows-x64-portable'
          if repo != 'OpenAnimationLibrary/ot3d':
              raise RuntimeError('This release workflow is for OpenAnimationLibrary/ot3d')

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))

          def sha256(path):
              with path.open('rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()

          for _ in range(150):
              run = api(f'actions/runs/{run_id}')
              if (run['head_repository']['full_name'], run['head_sha'], run['head_branch'],
                  run['name'], run['event']) != (repo, sha, 'main', 'Windows Build', 'push'):
                  raise RuntimeError('The Windows build does not match the release source')
              if run['status'] == 'completed':
                  if run['conclusion'] != 'success':
                      raise RuntimeError(f"Windows build concluded with {run['conclusion']}")
                  break
              time.sleep(30)
          else:
              raise RuntimeError('Timed out waiting for the Windows build')

          artifacts = api(f'actions/runs/{run_id}/artifacts')['artifacts']
          [artifact] = [item for item in artifacts
                        if item['name'] == f'Opentoonz-Windows-{sha}' and not item['expired']]
          archive = Path('windows-build.zip')
          with archive.open('wb') as file:
              subprocess.run(['gh', 'api', f"repos/{repo}/actions/artifacts/{artifact['id']}/zip"],
                             stdout=file, check=True)
          digest = 'sha256:' + sha256(archive)
          if digest != artifact['digest']:
              raise RuntimeError('Windows artifact digest mismatch')

          root = Path('staging') / package_name
          root.mkdir(parents=True)
          with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                  if not (root / member.filename).resolve().is_relative_to(root.resolve()):
                      raise RuntimeError(f'Unsafe ZIP path {member.filename}')
              source.extractall(root)
          if not any(p.is_file() and p.name.lower() == 'opentoonz.exe' for p in root.iterdir()):
              raise RuntimeError('Windows executable is missing')
          if not (root / 'portablestuff').is_dir():
              raise RuntimeError('Portable resource folder is missing')

          out = Path('release-assets')
          out.mkdir()
          notes = out / 'RELEASE_NOTES.md'
          notes.write_text(f"""## What's new

          - Native Animation:Master `.mdl` levels with 3D Animate Tool transforms and editable Level Palette colors named for model groups (#11, #20).
          - Separate native `.glb` levels and an on-screen Animate Tool controller for 3D rotation with Shift axis constraint (#18, #19).
          - 3D camera controls, chainable and positionable Three-Point Lighting, and 3D Merge for lighting multiple models together before compositing (#12, #13, #14, #17).
          - Flat canvas rendering and an option to disable default 3D lighting (#16).

          ## Windows x64 portable

          Extract the entire ZIP to a new writable folder and run the OpenToonz executable with `portablestuff` beside it. Use copies of scenes for alpha testing. This release was packaged from the successful Windows CI build. Interactive desktop testing is separate.

          [Source commit](https://github.com/{repo}/commit/{sha}) · [Windows build]({run['html_url']}) · [Changes since alpha.1](https://github.com/{repo}/compare/ot3d-v0.1.0-alpha.1...{tag})
          """, encoding='utf-8')
          shutil.copy('LICENSE.txt', root)
          shutil.copytree('stuff/doc/LICENSE', root / 'LICENSES')
          shutil.copy('thirdparty/cgltf/LICENSE', root / 'LICENSES' / 'LICENSE_cgltf.txt')
          shutil.copytree('thirdparty/libmypaint/license', root / 'LICENSES' / 'libmypaint-dependencies')
          shutil.copytree('doc/ot3d', root / 'OT3D-docs')
          shutil.copy(notes, root / 'README-OT3D.md')
          info = dict(version='0.1.0-alpha.2', tag=tag, source_sha=sha, platform='windows-x64-portable',
                      workflow_run=run['html_url'], source_artifact_id=artifact['id'],
                      source_artifact_digest=digest,
                      packaging_run=f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          (root / 'BUILD_INFO.json').write_text(json.dumps(info, indent=2) + '\n', encoding='utf-8')
          package = Path(shutil.make_archive(str(out / package_name), 'zip', root.parent, root.name))
          (out / 'SHA256SUMS').write_text(f'{sha256(package)}  {package.name}\n', encoding='utf-8')

      - name: Publish the Windows alpha prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/OT3D-0.1.0-alpha.2-windows-x64-portable.zip release-assets/SHA256SUMS \
            --target "$SOURCE_SHA" --title "OT3D 0.1.0-alpha.2" --prerelease --latest=false \
            --notes-file release-assets/RELEASE_NOTES.md
