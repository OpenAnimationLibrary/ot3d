name: A:M development diagnostics
on:
  push:
    branches: [feature/am-model-level-3d-transforms]
    paths: [.github/workflows/am_ci_diagnostics.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Extract compiler errors from native build logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request, os, re, json
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(Redirect)
          base='https://api.github.com/repos/OpenAnimationLibrary/ot3d'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          for run in [41654387745,41654387699,41654387545]:
              with opener.open(urllib.request.Request(base+f'/actions/runs/{run}/jobs',headers=headers)) as r:
                  jobs=json.load(r)['jobs']
              for job in jobs:
                  if job['conclusion']!='failure': continue
                  print('\nJOB',job['id'],job['name'],flush=True)
                  with opener.open(urllib.request.Request(base+f'/actions/jobs/{job["id"]}/logs',headers=headers)) as r:
                      lines=r.read(30_000_000).decode('utf-8','replace').splitlines()
                  indices=set()
                  for i,line in enumerate(lines):
                      if re.search(r'error:|error C[0-9]+|error LNK[0-9]+|undefined reference|FAILED:|CMake Error',line,re.I):
                          indices.update(range(max(0,i-2),min(len(lines),i+5)))
                  for i in sorted(indices)[:160]: print(lines[i][:1800])
                  if not indices:
                      print('\n'.join(lines[-35:]))
          PY
