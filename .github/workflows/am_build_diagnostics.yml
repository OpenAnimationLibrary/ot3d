name: A:M build diagnostics
on:
  push:
    branches: [diagnostics/am-level-build-e22bdd1]
    paths: [.github/workflows/am_build_diagnostics.yml]
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Prepare CMake fix without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, base64, os
          base='https://api.github.com/repos/OpenAnimationLibrary/ot3d'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          path='toonz/sources/toonz/CMakeLists.txt'
          with urllib.request.urlopen(urllib.request.Request(base+'/contents/'+path+'?ref=e22bdd19633a1208c2a1f75723ba8c841211d388',headers=headers),timeout=60) as r:
              source=json.load(r)
          assert source['sha']=='9485d0355689e9f6cec06426276ad10c363c4182'
          content=base64.b64decode(source['content']).decode('utf-8')
          anchor='# Hybrid Viewer consumes the immutable GLB geometry service directly.\ntarget_link_libraries(OpenToonz otglb)'
          assert content.count(anchor)==1
          content=content.replace(anchor,'# The application directly consumes both geometry services. Explicit targets\n# also propagate their headers when macOS links toonzlib by its file path.\ntarget_link_libraries(OpenToonz otglb otam)',1)
          request=urllib.request.Request(base+'/git/blobs',data=json.dumps({'content':content,'encoding':'utf-8'}).encode(),headers={**headers,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=60) as r:
              blob=json.load(r)
          print('FIXED_BLOB',blob['sha'],path)
          print('Added direct otam dependency; no branch changed.')
          PY
